<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h2>Registeration form</h2>
        <label for="email">
            email : <input type="email" name="email" placeholder="enter your email" required>
        </label>
        <label for="password">
            password : <input type="password" name="password"placeholder="*********" required>
        </label>
        <label for="gender">
            gender : male <input type="radio" name="gender" value="male"> female <input type="radio" name="gender" value="female">
        </label>
        <label for="city">
            city : <input type="text" name="city">
        </label>

        <button type="submit">Sign Up</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
