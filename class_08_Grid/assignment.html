<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width : 600px;
            height: 300px;
            display: grid;
            grid-template-columns: repeat(3 , 1fr);
            gap : 2px;
            background-color: brown;
        }

        .item {
            background-color: aqua;
            border: 2px solid black;
        }

        #second-item {
            grid-row: 1 / 3;
            grid-column: 2 / 4; 
        }

        #third-item {
            grid-row: 2 / 4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item"></div>
        <div class="item" id="second-item"></div>
        <div class="item" id="third-item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>
</html>
